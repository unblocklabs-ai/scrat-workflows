name: maintainer-sweep
description: Weekly architectural sweep of open issues and a rolling merged-PR root-cause ledger to propose one high-leverage primitive or refactor that removes a shared root cause.
override: true
enabled: false
priority: 5
on:
  cron: "0 13 * * 1"
  window: "168h"
  manual: true
permissions:
  github:
    - read
    - issue
  slack:
    - post
  workspace:
    - read
defaults:
  provider: codex-lb
  model: gpt-6.2-sol
  thinkingLevel: xhigh
  codemode: true
  retry:
    initialDelaySeconds: 60
    maxDelaySeconds: 3600
  tools:
    - read
    - grep
    - find
    - ls
    - git
    - github_search
config:
  channel: ""
  issueLabels:
    - maintainer-rfc
  maxOpenIssues: 80
  maxOpenPrs: 40
  recentMergedDays: 14
  maxMergedPrs: 60
  minLinkedIssues: 2
  maxIssueBodyChars: 1200
  d1TimeoutMs: 8000
  d1ExtractMaxItems: 24
  d1ExtractConcurrency: 4
  d1ExtractMinConfidence: 0.55
  d1ExtractMaxStateChars: 8000
  maxPrBodyChars: 800
  maxProposedHistory: 50
  ledgerBackfillDays: 60
  ledgerMaxEntries: 120
  ledgerBatchSize: 20
  ledgerParallelBatches: 3
  ledgerHunkConcurrency: 3
  ledgerSummaryMaxChars: 360
  ledgerSummaryMinChars: 10
  ledgerMaxAreas: 5
  ledgerMaxFilesPerPr: 12
  ledgerGitLogLimit: 300
  ledgerGitTimeoutMs: 5000
  ledgerDiffContextLines: 1
  ledgerMaxBufferBytes: 8388608
  ledgerExcludedDiffPaths:
    - package-lock.json
    - npm-shrinkwrap.json
    - pnpm-lock.yaml
    - yarn.lock
    - bun.lock
    - bun.lockb
    - Cargo.lock
    - composer.lock
    - Gemfile.lock
    - poetry.lock
    - uv.lock
    - "*.min.*"
    - "*.generated.*"
    - dist/**
    - generated/**
    - __generated__/**
  ledgerMaxHunksPerPr: 2
  ledgerCandidateHunksPerPr: 8
  ledgerMaxHunkChars: 700
  ledgerHunkMaxStateChars: 10000
  ledgerD1MinScore: 0.35
  d1MaxClusters: 16
  d1ClusterMinScore: 0.45
  d1MaxClusterItems: 8
  d1ClusterItemMaxChars: 360
  d1ClusterMaxStateChars: 10000
  d1ClusterConcurrency: 4
  maxDuplicateChecks: 2
  rfcMinSlugChars: 2
  rfcMaxSlugChars: 61
  rfcMinTitleChars: 5
  rfcMinBodyChars: 10
  ledger:
    provider: codex-lb
    model: gpt-6.1-terra
    thinkingLevel: low
